# Networking & BSD Sockets
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# Expanded Connection & Context Pool Sizing for Rapid Requests
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=16

# Wi-Fi (ESP32 Driver)
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y

# GPIO Subsystem for Relay Control
CONFIG_GPIO=y

# Logging Subsystem
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Static Allocation & Heap Sizing
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
